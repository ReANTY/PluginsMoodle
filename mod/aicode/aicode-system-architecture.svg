<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="1700" viewBox="0 0 2300 1700">
  <defs>
    <marker id="arrow-req" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L16,8 L0,16 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-res" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L16,8 L0,16 z" fill="#059669"/>
    </marker>
    <marker id="arrow-data" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L16,8 L0,16 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-ext" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L16,8 L0,16 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-opt" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L16,8 L0,16 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 36px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #334155; }
      .h1 { font: 700 24px Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .h2 { font: 700 19px Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .txt { font: 500 15px Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .label { font: 500 14px Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .legend { font: 500 15px Arial, sans-serif; fill: #111827; }

      .actor { fill: #ffffff; stroke: #1f2937; stroke-width: 2.2; }
      .node { fill: #ffffff; stroke: #1f2937; stroke-width: 2.2; }
      .container-front { fill: #eef6ff; stroke: #1f2937; stroke-width: 2.4; }
      .container-server { fill: #f0fff4; stroke: #1f2937; stroke-width: 2.4; }
      .container-ext { fill: #fff7ed; stroke: #1f2937; stroke-width: 2.4; }
      .gate { fill: #ffffff; stroke: #1f2937; stroke-width: 2.2; }
      .dbrect { fill: #ffffff; stroke: #1f2937; stroke-width: 2.2; }
      .dbcap { fill: #ffffff; stroke: #1f2937; stroke-width: 2.2; }

      .req { stroke: #1d4ed8; stroke-width: 3.6; fill: none; marker-end: url(#arrow-req); stroke-linecap: round; stroke-linejoin: round; }
      .res { stroke: #059669; stroke-width: 3.6; fill: none; marker-end: url(#arrow-res); stroke-linecap: round; stroke-linejoin: round; }
      .data { stroke: #7c3aed; stroke-width: 3.6; fill: none; marker-end: url(#arrow-data); stroke-linecap: round; stroke-linejoin: round; }
      .extflow { stroke: #d97706; stroke-width: 3.6; fill: none; marker-end: url(#arrow-ext); stroke-linecap: round; stroke-linejoin: round; }
      .opt { stroke: #475569; stroke-width: 3.6; fill: none; marker-end: url(#arrow-opt); stroke-dasharray: 10 7; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="0" y="0" width="2300" height="1700" fill="#ffffff"/>
  <text x="1150" y="56" text-anchor="middle" class="title">Arsitektur Sistem Plugin Moodle AICode</text>
  <text x="1150" y="86" text-anchor="middle" class="subtitle">Jalur panah disusun per lane untuk menghindari tumpang tindih dan memperjelas asal-tujuan alur.</text>

  <!-- Actors -->
  <rect x="100" y="80" width="180" height="64" rx="12" class="actor"/>
  <text x="190" y="118" class="h2">Student</text>
  <rect x="320" y="80" width="180" height="64" rx="12" class="actor"/>
  <text x="410" y="118" class="h2">Teacher</text>
  <rect x="540" y="80" width="180" height="64" rx="12" class="actor"/>
  <text x="630" y="118" class="h2">Admin</text>

  <!-- Frontend -->
  <rect x="60" y="180" width="700" height="820" rx="16" class="container-front"/>
  <text x="410" y="220" class="h1">Browser Frontend</text>

  <rect x="120" y="280" width="240" height="110" rx="10" class="node"/>
  <text x="240" y="326" class="h2">Activity Page</text>
  <text x="240" y="350" class="txt">view.php + renderer.php</text>

  <rect x="410" y="280" width="300" height="140" rx="10" class="node"/>
  <text x="560" y="330" class="h2">Editor UI</text>
  <text x="560" y="354" class="txt">amd/src/editor.js</text>
  <text x="560" y="376" class="txt">Run | Hint | Submit</text>

  <rect x="120" y="450" width="260" height="110" rx="10" class="node"/>
  <text x="250" y="496" class="h2">Preview + History</text>
  <text x="250" y="520" class="txt">iframe + sessionStorage</text>

  <rect x="260" y="620" width="340" height="120" rx="10" class="node"/>
  <text x="430" y="670" class="h2">AJAX Client</text>
  <text x="430" y="694" class="txt">core/ajax webservice call</text>

  <!-- Server -->
  <rect x="820" y="180" width="1080" height="980" rx="16" class="container-server"/>
  <text x="1360" y="220" class="h1">Moodle Server - mod/aicode</text>

  <polygon points="1330,260 1430,320 1330,380 1230,320" class="gate"/>
  <text x="1330" y="314" class="h2">Security Gate</text>
  <text x="1330" y="338" class="txt">login + context + capability + sesskey</text>

  <rect x="860" y="400" width="240" height="100" rx="10" class="node"/>
  <text x="980" y="442" class="h2">WS Registry</text>
  <text x="980" y="466" class="txt">db/services.php</text>

  <rect x="860" y="550" width="210" height="100" rx="10" class="node"/>
  <text x="965" y="592" class="h2">run_code</text>
  <text x="965" y="616" class="txt">execute code</text>

  <rect x="1110" y="550" width="250" height="100" rx="10" class="node"/>
  <text x="1235" y="592" class="h2">analyze_code</text>
  <text x="1235" y="616" class="txt">AI diagnosis</text>

  <rect x="1400" y="550" width="220" height="100" rx="10" class="node"/>
  <text x="1510" y="592" class="h2">record_hint</text>
  <text x="1510" y="616" class="txt">track hint usage</text>

  <rect x="1660" y="550" width="220" height="100" rx="10" class="node"/>
  <text x="1770" y="592" class="h2">send_to_teacher</text>
  <text x="1770" y="616" class="txt">review request</text>

  <rect x="860" y="710" width="240" height="100" rx="10" class="node"/>
  <text x="980" y="752" class="h2">Plugin Settings</text>
  <text x="980" y="776" class="txt">executor_url, ttl, threshold</text>

  <rect x="1140" y="710" width="260" height="100" rx="10" class="node"/>
  <text x="1270" y="752" class="h2">Moodle AI Manager</text>
  <text x="1270" y="776" class="txt">core_ai generate_text</text>

  <rect x="1440" y="710" width="440" height="100" rx="10" class="node"/>
  <text x="1660" y="752" class="h2">Event + Privacy + Gradebook</text>
  <text x="1660" y="776" class="txt">course_module_viewed + provider + grade_update</text>

  <rect x="1120" y="870" width="500" height="110" rx="10" class="node"/>
  <text x="1370" y="918" class="h2">Data Access Layer</text>
  <text x="1370" y="942" class="txt">aicode + attempts + cache + overrides + materials</text>

  <!-- Database -->
  <rect x="1950" y="260" width="300" height="630" class="dbrect"/>
  <ellipse cx="2100" cy="260" rx="150" ry="28" class="dbcap"/>
  <ellipse cx="2100" cy="890" rx="150" ry="28" class="dbcap"/>
  <text x="2100" y="300" class="h2">Moodle DB</text>
  <text x="2100" y="328" class="txt">aicode</text>
  <text x="2100" y="352" class="txt">aicode_attempts</text>
  <text x="2100" y="376" class="txt">aicode_cache</text>
  <text x="2100" y="400" class="txt">aicode_teacher_overrides</text>
  <text x="2100" y="424" class="txt">aicode_materials</text>

  <!-- External -->
  <rect x="820" y="1210" width="1080" height="300" rx="16" class="container-ext"/>
  <text x="1360" y="1250" class="h1">External Services</text>

  <rect x="900" y="1310" width="340" height="130" rx="10" class="node"/>
  <text x="1070" y="1364" class="h2">Executor Microservice</text>
  <text x="1070" y="1388" class="txt">POST /run sandbox execution</text>

  <rect x="1290" y="1310" width="520" height="130" rx="10" class="node"/>
  <text x="1550" y="1364" class="h2">AI Provider</text>
  <text x="1550" y="1388" class="txt">contoh: Ollama via Moodle AI provider chain</text>

  <!-- Frontend entry -->
  <line x1="190" y1="144" x2="240" y2="280" class="req"/>
  <line x1="410" y1="144" x2="290" y2="280" class="req"/>
  <polyline points="630,144 630,170 980,170 980,710" class="req"/>

  <!-- Frontend internal -->
  <line x1="360" y1="335" x2="410" y2="335" class="req"/>
  <polyline points="560,420 560,560 450,620" class="req"/>
  <polyline points="380,500 410,500" class="res"/>
  <line x1="380" y1="520" x2="410" y2="360" class="res"/>

  <!-- AJAX to security lane -->
  <polyline points="600,680 760,680 760,320 1230,320" class="req"/>
  <text x="860" y="668" class="label">AJAX WS request</text>

  <!-- Security fan-out -->
  <polyline points="1270,380 1270,510 1040,510 1040,550" class="req"/>
  <polyline points="1320,380 1320,520 1235,520 1235,550" class="req"/>
  <polyline points="1370,380 1370,510 1510,510 1510,550" class="req"/>
  <polyline points="1410,340 1410,500 1770,500 1770,550" class="req"/>

  <!-- WS registry relation -->
  <polyline points="1230,300 980,300 980,400" class="req"/>
  <text x="1080" y="290" class="label">service discovery</text>

  <!-- Endpoint responses to AJAX in separate lanes -->
  <polyline points="860,610 780,610 780,680 600,680" class="res"/>
  <polyline points="1110,620 760,620 760,720 600,720" class="res"/>
  <polyline points="1400,630 740,630 740,760 600,760" class="res"/>
  <polyline points="1660,640 720,640 720,800 600,800" class="res"/>
  <text x="690" y="806" class="label">WS response lanes</text>

  <!-- Runtime config -->
  <line x1="980" y1="710" x2="965" y2="650" class="req"/>
  <line x1="1060" y1="710" x2="1235" y2="650" class="req"/>
  <text x="1100" y="700" class="label">runtime config</text>

  <!-- Endpoint to DAL -->
  <polyline points="965,650 965,870 1220,870" class="data"/>
  <line x1="1235" y1="650" x2="1235" y2="870" class="data"/>
  <line x1="1510" y1="650" x2="1510" y2="870" class="data"/>
  <polyline points="1770,650 1770,860 1590,860" class="data"/>
  <text x="1490" y="846" class="label">persist attempt/cache/hint</text>

  <!-- Page load from DAL -->
  <polyline points="360,340 780,340 780,910 1120,910" class="req"/>
  <polyline points="1120,960 740,960 740,380 360,380" class="res"/>
  <text x="740" y="948" class="label">problem config + templates</text>

  <!-- DAL and Event to DB -->
  <line x1="1620" y1="910" x2="1950" y2="760" class="data"/>
  <line x1="1950" y1="820" x2="1620" y2="960" class="res"/>
  <line x1="1660" y1="810" x2="1950" y2="860" class="data"/>
  <text x="1790" y="900" class="label">DB read/write</text>

  <!-- run_code <-> executor -->
  <polyline points="930,650 930,1180 1030,1310" class="extflow"/>
  <polyline points="1110,1310 990,1180 990,650" class="res"/>
  <text x="950" y="1168" class="label">execute sandbox</text>

  <!-- analyze_code <-> AI manager/provider -->
  <line x1="1245" y1="650" x2="1270" y2="710" class="extflow"/>
  <line x1="1210" y1="710" x2="1190" y2="650" class="res"/>
  <polyline points="1310,810 1460,1310" class="extflow"/>
  <polyline points="1620,1310 1360,810" class="res"/>
  <text x="1490" y="1150" class="label">AI request / AI response</text>

  <!-- Optional teacher notification -->
  <polyline points="1770,550 1840,550 1840,140 500,140" class="opt"/>
  <text x="1500" y="130" class="label">optional teacher notification</text>

  <!-- Legend -->
  <rect x="60" y="1540" width="2180" height="110" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <line x1="110" y1="1580" x2="210" y2="1580" class="req"/>
  <text x="225" y="1586" class="legend">Request / command</text>
  <line x1="520" y1="1580" x2="620" y2="1580" class="res"/>
  <text x="635" y="1586" class="legend">Response / return</text>
  <line x1="930" y1="1580" x2="1030" y2="1580" class="data"/>
  <text x="1045" y="1586" class="legend">Data persistence</text>
  <line x1="1320" y1="1580" x2="1420" y2="1580" class="extflow"/>
  <text x="1435" y="1586" class="legend">External integration</text>
  <line x1="1710" y1="1580" x2="1810" y2="1580" class="opt"/>
  <text x="1825" y="1586" class="legend">Optional flow</text>
</svg>
